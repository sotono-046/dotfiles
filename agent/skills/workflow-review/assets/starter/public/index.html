<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>業務フローレビュー</title><link rel="stylesheet" href="/styles.css"><script type="module" src="/app.js"></script></head>
<body><header class="page"><p class="eyebrow">WORKFLOW REVIEW</p><h1 id="title">業務フローを確認する</h1><p id="description"></p><div class="toolbar"><span id="identity"></span><button id="change-author" type="button">名前を変更</button><button id="clear-author" type="button">名前を消去</button></div><p class="legend"><span class="badge human">人が対応</span><span class="badge app">アプリが対応</span><span class="badge implemented">実装済み</span><span class="badge planned">予定</span><span class="badge unconfirmed">未確認</span></p></header><main class="page" id="flows"></main><details class="page" id="history"><summary>過去のコメント</summary><p>現在のフローに含まれなくなった対象のコメントを表示します。</p><div id="history-list" aria-live="polite"></div></details><p class="page" id="page-error" role="alert"></p>
<dialog id="comments" aria-labelledby="comment-title"><div class="popover-heading"><h2 id="comment-title">コメント</h2><button type="button" id="close-comments" aria-label="コメントを閉じる">×</button></div><p id="target-label"></p><div id="comment-list" aria-live="polite"></div><form id="comment-form"><label for="author">名前</label><input id="author" name="author" maxlength="80" autocomplete="name" required><label for="body">コメント</label><textarea id="body" name="body" maxlength="4000" rows="3" required></textarea><p class="hint">⌘ / Ctrl + Enter で送信・Enter で改行</p><p id="comment-error" role="alert"></p><button id="submit-comment" type="submit">送信</button></form></dialog></body></html>
