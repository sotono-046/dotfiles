version: "1.0"

defaults:
  base_dir: ../worktrees/__PROJECT_NAME__

hooks:
  post_create:
    - type: command
      command: |
        # Get the original repository path (parent of worktree)
        CURRENT_WORKTREE=$(pwd -P 2>/dev/null) || CURRENT_WORKTREE=""
        ORIGINAL_REPO=""
        if [ -n "${CURRENT_WORKTREE}" ]; then
          ORIGINAL_REPO=$(
            git worktree list --porcelain 2>/dev/null |
              awk -v current="${CURRENT_WORKTREE}" '
                /^worktree / {
                  path = substr($0, 10)
                  if (path != current) {
                    print path
                    exit
                  }
                }
              '
          )
        fi

        if [ -z "${ORIGINAL_REPO}" ] || [ ! -d "${ORIGINAL_REPO}" ]; then
          echo "Skipped original repository setup: another worktree was not found"
        else
          # .TEMP
          if [ -e "${ORIGINAL_REPO}/.temp" ]; then
            ln -sf "${ORIGINAL_REPO}/.temp" .temp
            echo "Linked .temp from original repository"
          fi

          # IDE.YML
          if [ -f "${ORIGINAL_REPO}/ide.yml" ]; then
            cp -f "${ORIGINAL_REPO}/ide.yml" ide.yml
            echo "Copied ide.yml from original repository"
          fi
        fi

    - type: command
      command: |
        if [ "${WTP_INSTALL_DEPS:-0}" = "1" ]; then
          if ! command -v bun >/dev/null 2>&1; then
            echo "WTP_INSTALL_DEPS=1, but bun is not available"
            exit 1
          fi
          bun install
        else
          echo "Skipped bun install (set WTP_INSTALL_DEPS=1 to enable)"
        fi

    - type: command
      command: echo "Created new worktree!"
