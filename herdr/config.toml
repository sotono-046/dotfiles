# Herdr configuration
# Linked to ~/.config/herdr/config.toml by install.sh.

# Keep the tracked config read-only from Herdr's first-run setup.
onboarding = false

[theme]
name = "catppuccin"

auto_switch = false
[terminal]
default_shell = "/bin/zsh"
shell_mode = "auto"
new_cwd = "follow"

[keys]
# Prefix + hjkl pane navigation (ctrl+a).
prefix = "ctrl+a"
workspace_picker = ""
new_workspace = "prefix+n"
rename_workspace = ""
close_workspace = "prefix+shift+w"
next_tab = ""
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
split_vertical = "prefix+_"
split_horizontal = "prefix+minus"
close_pane = "prefix+w"
resize_mode = "prefix+r"
copy_mode = "prefix+["

[ui]

# >>> herdr-radar tab-bar block
tab_bar_right_separator = " · "
tab_bar_right = [
    { type = 'command', command = 'cat "/Users/sotono/.local/state/herdr/plugins/hhdebb.herdr-radar/tabbar${HERDR_SESSION:+-$HERDR_SESSION}.txt"', interval_seconds = 6, timeout_seconds = 2 },
]
# <<< herdr-radar tab-bar block

mouse_capture = true
copy_on_select = true
pane_borders = true

agent_panel_sort = "spaces"
status_indicators = "symbols"
[ui.sound]
enabled = false

# >>> herdr-radar theme block
[theme.custom]
active_row_bg = "#414868"
# <<< herdr-radar theme block

# >>> herdr-radar sidebar block
[ui.sidebar.agents]
# logo glyphs: font
rows = [
    [
        { token = "$group_parent", fg = "#8b8e9c", bold = true, dim = false },
